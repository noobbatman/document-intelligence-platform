name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

# Default: deny everything. Each job below declares only what it needs.
permissions: {}

env:
  PYTHON_VERSION: "3.11"
  PIPELINE_VERSION: "0.3.0"
  LLM_EXTRACTION_ENABLED: "false"
  LLM_UNKNOWN_EXTRACTION_ENABLED: "false"
  STORAGE_BACKEND: "local"
  RATE_LIMIT_ENABLED: "false"
  COVERAGE_FAIL_UNDER: "80"
  HEALTHCHECK_URL: "http://localhost:8000/api/v1/health/ready"

jobs:
  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install OCR system dependencies
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng

      - name: Install Python dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Install spaCy model
        run: python -m spacy download en_core_web_sm

      - name: Ruff check
        run: ruff check app/ tests/ scripts/guardianci_ai_review.py scripts/guardianci_metrics.py scripts/guardianci_false_positive.py scripts/guardianci_deploy.py

      - name: Ruff format
        run: ruff format --check app/ tests/ scripts/guardianci_ai_review.py scripts/guardianci_metrics.py scripts/guardianci_false_positive.py scripts/guardianci_deploy.py

      - name: Run pytest with coverage gate
        run: |
          pytest \
            --ignore=tests/integration \
            --cov=app \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under="${COVERAGE_FAIL_UNDER}"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: warn

  docker-smoke:
    name: Docker smoke and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Create CI environment file
        run: cp .env.example .env

      - name: Build Docker image
        run: docker build -t document-intelligence-platform:${{ github.sha }} .

      - name: Start Docker Compose stack
        run: docker compose up -d --build api postgres redis

      - name: Wait for readiness endpoint
        run: |
          for attempt in {1..45}; do
            status_code="$(curl -s -o /tmp/health.out -w "%{http_code}" "${HEALTHCHECK_URL}" || true)"

            if [ "$status_code" = "200" ]; then
              echo "Readiness check passed."
              exit 0
            fi

            echo "Readiness attempt ${attempt} returned ${status_code}; retrying..."
            sleep 2
          done

          echo "Readiness check never returned 200 from ${HEALTHCHECK_URL}."
          cat /tmp/health.out || true
          docker compose logs api postgres redis
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install Python dependencies
        run: uv pip install --system -e ".[dev]"

      - name: Run live HTTP integration tests
        env:
          DOCINTEL_BASE_URL: http://localhost:8000
        run: pytest tests/integration

      - name: Print container logs on failure
        if: failure()
        run: docker compose logs api postgres redis

      - name: Stop Docker Compose stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  ai-review:
    name: AI review stub
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -r requirements/base.lock

      - name: Install gitleaks
        run: |
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.22.1/gitleaks_8.22.1_linux_x64.tar.gz" \
            | tar -xz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks

      - name: Secret pre-scan (gitleaks)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin ${{ github.base_ref }} --no-tags
          gitleaks detect --source . \
            --log-opts "origin/${{ github.base_ref }}..HEAD" \
            --no-banner \
            --exit-code 0 \
            --report-format json \
            --report-path gitleaks-report.json 2>&1 || true
          if [ -s gitleaks-report.json ]; then
            COUNT=$(python3 -c "
          import json, sys
          data = json.load(open('gitleaks-report.json'))
          print(len(data) if isinstance(data, list) else 0)
          " 2>/dev/null || echo "some")
            if [ "$GUARDIANCI_AI_ENABLED" = "false" ]; then
              echo "ERROR: Gitleaks found ${COUNT} secret(s). AI review is disabled — gitleaks is the only enforcement layer. Fix secrets before merging." >&2
              cat gitleaks-report.json
              exit 1
            else
              echo "::warning::Gitleaks found ${COUNT} potential secret(s) — AI review will also flag these as CRITICAL."
              cat gitleaks-report.json
            fi
          fi
        env:
          GUARDIANCI_AI_ENABLED: ${{ vars.GUARDIANCI_AI_ENABLED || vars.GUARDIANCI_GEMINI_ENABLED || 'true' }}

      - name: Run GuardianCI AI security review
        id: ai-review
        env:
          # New provider-agnostic env vars (v0.1.0+)
          GUARDIANCI_LLM_PROVIDER: ${{ vars.GUARDIANCI_LLM_PROVIDER || 'gemini' }}
          GUARDIANCI_LLM_MODEL: ${{ vars.GUARDIANCI_LLM_MODEL || vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          GUARDIANCI_LLM_API_KEY: ${{ secrets.GUARDIANCI_LLM_API_KEY || secrets.GEMINI_API_KEY }}
          GUARDIANCI_LLM_BASE_URL: ${{ vars.GUARDIANCI_LLM_BASE_URL }}
          GUARDIANCI_AI_ENABLED: ${{ vars.GUARDIANCI_AI_ENABLED || vars.GUARDIANCI_GEMINI_ENABLED || 'true' }}
          GUARDIANCI_AUTOFIX_ENABLED: "false"
          GUARDIANCI_REVIEW_RESULT_PATH: guardianci-review-result.json
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Legacy fallbacks — keep until repo secrets are migrated
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/guardianci_ai_review.py --review-only

      - name: Upload GuardianCI review result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guardianci-review-result
          path: guardianci-review-result.json
          if-no-files-found: warn

  metrics:
    name: Security metrics
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ai-review
    if: ${{ always() && github.event_name == 'pull_request' }}
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Download GuardianCI review result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: guardianci-review-result
          path: .

      - name: Publish GuardianCI metrics
        # guardianci_metrics.py uses only the standard library; no dependency install needed.
        env:
          GUARDIANCI_METRICS_WEBHOOK_URL: ${{ secrets.GUARDIANCI_METRICS_WEBHOOK_URL }}
          GUARDIANCI_METRICS_WEBHOOK_SECRET: ${{ secrets.GUARDIANCI_METRICS_WEBHOOK_SECRET }}
        run: python scripts/guardianci_metrics.py --result guardianci-review-result.json

  auto-fix:
    name: Auto-fix draft PR
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - ai-review
    if: ${{ always() && github.event_name == 'pull_request' && (vars.GUARDIANCI_AUTOFIX_ENABLED || 'true') == 'true' }}
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Set up uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: uv pip install --system -r requirements/base.lock

      - name: Prepare GuardianCI auto-fix draft PR
        env:
          GUARDIANCI_LLM_PROVIDER: ${{ vars.GUARDIANCI_LLM_PROVIDER || 'gemini' }}
          GUARDIANCI_LLM_MODEL: ${{ vars.GUARDIANCI_LLM_MODEL || vars.GEMINI_MODEL || 'gemini-2.0-flash' }}
          GUARDIANCI_LLM_API_KEY: ${{ secrets.GUARDIANCI_LLM_API_KEY || secrets.GEMINI_API_KEY }}
          GUARDIANCI_LLM_BASE_URL: ${{ vars.GUARDIANCI_LLM_BASE_URL }}
          GUARDIANCI_AI_ENABLED: ${{ vars.GUARDIANCI_AI_ENABLED || vars.GUARDIANCI_GEMINI_ENABLED || 'true' }}
          GUARDIANCI_AUTOFIX_ENABLED: ${{ vars.GUARDIANCI_AUTOFIX_ENABLED || 'true' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/guardianci_ai_review.py --auto-fix-only

  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      packages: write
    needs:
      - test
      - docker-smoke
      - ai-review
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release image
        env:
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: docker build -t "${DEPLOY_IMAGE}" .

      - name: Push release image
        env:
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
        run: docker push "${DEPLOY_IMAGE}"

      - name: Download coverage report
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: coverage-report
          path: deploy-artifacts/coverage

      - name: Download GuardianCI review result
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: guardianci-review-result
          path: deploy-artifacts/review

      - name: Trigger Render deploy
        env:
          DEPLOY_IMAGE: ghcr.io/${{ github.repository }}:${{ github.sha }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RAILWAY_WEBHOOK_URL }}
          RENDER_ROLLBACK_HOOK_URL: ${{ secrets.RAILWAY_ROLLBACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          PRODUCTION_HEALTHCHECK_URL: ${{ vars.PRODUCTION_HEALTHCHECK_URL }}
        run: >-
          python scripts/guardianci_deploy.py
          --coverage deploy-artifacts/coverage/coverage.xml
          --review-result deploy-artifacts/review/guardianci-review-result.json
          --health-timeout 600
          --health-interval 15
