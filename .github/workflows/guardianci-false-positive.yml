name: GuardianCI False Positive Feedback

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions: {}

jobs:
  record-false-positive:
    name: Record /fp feedback
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: >-
      ${{
        (github.event_name == 'issue_comment' &&
          github.event.issue.pull_request &&
          startsWith(github.event.comment.body, '/fp')) ||
        (github.event_name == 'pull_request_review_comment' &&
          startsWith(github.event.comment.body, '/fp'))
      }}
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record GuardianCI false-positive exclusion
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIANCI_METRICS_BRANCH: guardianci-metrics
        run: python scripts/guardianci_false_positive.py

  monthly-audit:
    name: Monthly false-positive audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    permissions:
      contents: read
      issues: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Post GuardianCI exclusions audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GUARDIANCI_METRICS_BRANCH: guardianci-metrics
          GUARDIANCI_EXCLUSIONS_AUDIT_ISSUE: ${{ vars.GUARDIANCI_EXCLUSIONS_AUDIT_ISSUE }}
        run: python scripts/guardianci_false_positive.py --audit
